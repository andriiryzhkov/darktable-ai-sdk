[project]
name = "darktable-ai-sdk"
# single-sourced from dt_ai_sdk/__init__.py – see [tool.hatch.version]
dynamic = ["version"]
description = "Darktable AI SDK for building model repositories that can be consumed as .dtmodel packages"
requires-python = ">=3.11"
license = "GPL-3.0"
readme = "README.md"
authors = [
    { name = "darktable developers" },
]
keywords = ["darktable", "ai", "model", "sdk", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]

# Deliberately minimal: the SDK orchestrates model builds via subprocess.
# Heavy deps (torch, onnx, opencv, etc.) belong to the model repo, not here.
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
dtai = "dt_ai_sdk.__main__:main"

[project.optional-dependencies]
# `dtai validate` loads each export to check it. Kept optional so the core
# stays light – a model repo normally declares onnxruntime itself.
validate = [
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Needed by the example-repo tests, which build a real ONNX graph and
    # load it back. Without these two the suite silently skips them.
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.urls]
Homepage = "https://github.com/darktable-org/darktable-ai-sdk"
Repository = "https://github.com/darktable-org/darktable-ai-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package is the one source of truth for the version: it is what
# `dtai --version` reports and what {{sdk_version}} pins into every
# scaffolded repo, so a second copy here could silently drift.
[tool.hatch.version]
path = "dt_ai_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dt_ai_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
